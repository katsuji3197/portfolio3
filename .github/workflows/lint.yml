# ワークフローの名前
name: Lint Check

# このワークフローが実行されるタイミングを指定
on:
  # mainブランチへのpush時
  push:
    branches: ['main']
  # mainブランチへのプルリクエスト作成・更新時
  pull_request:
    branches: ['main']

# 実行するジョブを定義
jobs:
  lint:
    # ジョブの名前
    name: Run ESLint
    # 実行する仮想環境の種類
    runs-on: ubuntu-latest

    # ジョブのステップを定義
    steps:
      # 1. リポジトリのコードをチェックアウトする
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. pnpmをインストールする
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: latest

      # 3. Node.js環境をセットアップする（pnpmキャッシュ付き）
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          # プロジェクトで使用しているNode.jsのバージョンを指定
          node-version: '22'
          cache: 'pnpm'

      # 4. 依存パッケージをインストールする
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 5. TypeScriptの型チェックを実行する
      - name: Type Check
        run: pnpm type-check

      # 6. Lintチェックを実行する
      - name: Run Lint
        run: pnpm lint
