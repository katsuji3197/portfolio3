name: Run Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # テストスクリプトが存在するかチェック
      - name: Check if test script exists
        id: check-test
        run: |
          if pnpm run --silent test > /dev/null 2>&1; then
            echo "test-script-exists=true" >> $GITHUB_OUTPUT
          else
            echo "test-script-exists=false" >> $GITHUB_OUTPUT
          fi

      # テストスクリプトが存在する場合のみ実行
      - name: Run Tests
        if: steps.check-test.outputs.test-script-exists == 'true'
        run: pnpm test

      # テストスクリプトが存在しない場合はスキップ
      - name: Skip Tests
        if: steps.check-test.outputs.test-script-exists == 'false'
        run: echo "No test script found. Skipping tests."
